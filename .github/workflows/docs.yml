name: Documentation
on:
  pull_request:
  push:
    branches: [preview, master]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish, rollback]
        default: publish
        description: Publish the selected branch or restore its previously activated release
      release:
        type: string
        description: Full 64-character release ID, required for rollback
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-preview
          path: dist/
          retention-days: 7
  activate:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Publish and rollback share one writer lock per bucket. It is not FIFO.
    concurrency:
      group: cscheap-docs-activation-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Repository Secrets only. Bucket names are fixed in scripts/deployment.mjs.
      CSCHEAP_DOCS_R2_ACCOUNT_ID: ${{ secrets.CSCHEAP_DOCS_R2_ACCOUNT_ID }}
      CSCHEAP_DOCS_R2_ACCESS_KEY_ID: ${{ secrets.CSCHEAP_DOCS_R2_ACCESS_KEY_ID }}
      CSCHEAP_DOCS_R2_SECRET_ACCESS_KEY: ${{ secrets.CSCHEAP_DOCS_R2_SECRET_ACCESS_KEY }}
      DOCS_PUBLISH_MODE: ${{ inputs.mode || 'publish' }}
      DOCS_ROLLBACK_RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Read-only job token is used to fetch the selected publication branch.
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: env.DOCS_PUBLISH_MODE == 'publish'
        run: npm run docs:build
      - run: node scripts/publish.mjs

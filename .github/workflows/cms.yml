name: Tina editor artifact
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [tina/**, scripts/tina.mjs, package.json, package-lock.json, .github/workflows/cms.yml]
permissions:
  contents: read
jobs:
  editor:
    if: github.ref == 'refs/heads/master' && vars.CSCHEAP_DOCS_CMS_BUILD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CSCHEAP_DOCS_ENVIRONMENT: prod
      CSCHEAP_DOCS_INFISICAL_IDENTITY_ID: ${{ vars.CSCHEAP_DOCS_CMS_INFISICAL_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run cms:check
      - run: node scripts/with-secrets.mjs cms
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tina-editor
          path: public/admin/
          retention-days: 7
